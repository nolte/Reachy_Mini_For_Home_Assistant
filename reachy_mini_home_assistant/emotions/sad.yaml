# Head drop, antennas lowered, slow return. ~2.8 s total.
name: sad
description: Head drop with antennas lowered, then slow return
type: one_shot
phases:
  - name: drop
    duration_s: 0.60
    easing: ease_in_out
    end:
      z_mm: -8
      pitch_deg: -18
      antenna_left_deg: -25
      antenna_right_deg: 25
  - name: hold
    duration_s: 1.20
    easing: linear
    end:
      z_mm: -8
      pitch_deg: -18
      antenna_left_deg: -25
      antenna_right_deg: 25
  - name: slow_rise
    duration_s: 1.00
    easing: ease_in_out
    end:  # FIX 2026-05-15: was {}; antennas at 0° trip Dynamixel deadband
      antenna_left_deg: 15
      antenna_right_deg: 15
