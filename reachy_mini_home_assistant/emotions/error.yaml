# Slow, deliberate head-shake "no" for command failures. ~3.6 s total.
# Revised 2026-05-15: wider yaw + longer holds for clear "no" gesture.
name: error
description: Slow deliberate head-shake "no" for command failures
type: one_shot
phases:
  - name: left_1
    duration_s: 0.50
    easing: ease_in_out
    end:
      pitch_deg: -5
      yaw_deg: -25
      antenna_left_deg: -15
      antenna_right_deg: 15
  - name: right_1
    duration_s: 0.65
    easing: ease_in_out
    end:
      pitch_deg: -5
      yaw_deg: 25
      antenna_left_deg: 15
      antenna_right_deg: -15
  - name: left_2
    duration_s: 0.65
    easing: ease_in_out
    end:
      pitch_deg: -5
      yaw_deg: -25
      antenna_left_deg: -15
      antenna_right_deg: 15
  - name: right_2
    duration_s: 0.65
    easing: ease_in_out
    end:
      pitch_deg: -5
      yaw_deg: 25
      antenna_left_deg: 15
      antenna_right_deg: -15
  - name: home
    duration_s: 0.80
    easing: min_jerk
    end:  # antennas at +15° (out of deadband)
      antenna_left_deg: 15
      antenna_right_deg: 15
